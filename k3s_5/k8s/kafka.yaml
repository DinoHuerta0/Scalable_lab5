# Apache Kafka con un solo broker en modo KRaft (sin ZooKeeper): equivale a Kinesis.
# Las demás piezas lo encuentran en kafka.${NAMESPACE}.svc.cluster.local:9092.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ${NAMESPACE}
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ${NAMESPACE}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Sin esto, Kubernetes inyecta variables KAFKA_PORT, KAFKA_SERVICE_HOST... y la
      # imagen las convierte en configuración del broker
      # Solo en el nodo de datos (ver infra/k3s.tf): su disco local-path queda ahí
      nodeSelector:
        lab5/role: data
      tolerations:
        - { key: lab5/role, operator: Equal, value: data, effect: NoSchedule }
      enableServiceLinks: false
      containers:
        - name: kafka
          image: ${KAFKA_IMAGE}
          ports:
            - containerPort: 9092
          env:
            - { name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw" }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.${NAMESPACE}.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "24" }   # como la retención mínima de Kinesis
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms1g -Xmx1g" }
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
